[project]
name = "cointaxman"
version = "0.1.0"
description = "Calculate cryptocurrency taxes for Germany"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dateutil>=2.8.1",
    "requests>=2.32.4",
    "xlsxwriter>=3.0.3",
    "tzdata>=2022.1",
]

[dependency-groups]
dev = [
    "black>=24.3.0",
    "flake8>=4.0.1",
    "flake8-bugbear>=22.4.25",
    "isort>=5.10.1",
    "mypy>=0.950",
    "mypy-extensions>=0.4.3",
    "types-python-dateutil>=2.8.16",
    "types-requests>=2.27.27",
]
